name: Release

# Triggered when you push a tag like v1.2.3 to main. The tag version is used to
# build installers for Windows, macOS and Linux and attach them to a GitHub
# Release. NOTE: builds are currently unsigned (no code-signing secrets); only
# the app bundle is produced, not a notarized/signed artifact.
on:
  push:
    tags:
      - 'v*'
  # Allow manually re-publishing an existing tag (e.g. after a failed or
  # partial release). Supply the tag name (e.g. "v0.1.1") in the input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Resolve the tag name: from the push tag, or from the manual input.
      # This must run before checkout so the exact tag can be checked out.
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      # Check out the exact tag commit so typecheck/lint/test/package all run on
      # the released code (not main HEAD). fetch-depth: 0 grabs full history so
      # electron-builder can resolve the version/tag metadata.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bsdtar (libarchive-tools) is used by electron-builder for AppImage;
          # ruby/fpm produce the .deb package.
          sudo apt-get install -y libarchive-tools ruby
          sudo gem install --no-document fpm

      # Derive the app version from the tag, stripping the leading "v".
      - name: Compute version
        id: ver
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: pnpm --filter @meow-gateway/desktop package --config.extraMetadata.version=$VERSION --publish never

      - name: Collect installers
        shell: bash
        run: echo "Release artifacts are in apps/desktop/dist"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            apps/desktop/dist/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      # gh release create/upload needs a git repository (it resolves the tag
      # against the working tree), so check out the exact tag before publishing.
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: find release-artifacts -type f | sort

      # Use the gh CLI (preinstalled on GitHub runners) instead of
      # softprops/action-gh-release@v2: that action is unreliable when re-running
      # against a release that already exists (it calls the delete-asset API and
      # 404s/NPEs). This step is idempotent: on a fresh tag it creates the
      # release, and on a re-run it uploads/overwrites the assets onto the
      # existing release. We never delete the release or its tag.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mapfile -t files < <(find release-artifacts -type f | sort)
          args=()
          for f in "${files[@]}"; do
            args+=("$f")
          done

          # Try to create the release first. If it already exists (or an asset
          # name collides with an asset left behind by an earlier run), gh
          # returns "HTTP 422: Validation Failed / ReleaseAsset.name already
          # exists". In that case fall back to uploading with --clobber, which
          # overwrites any pre-existing asset with the same name. This makes the
          # step idempotent across re-runs without relying on `gh release view`
          # (which is unreliable for draft releases or releases that lost their
          # tag). We never delete the release or its tag.
          if gh release create "$TAG" \
              --title "Meow Gateway v${version}" \
              --generate-notes \
              "${args[@]}" 2>/tmp/release-create.err; then
            echo "Release $TAG created with assets."
          else
            echo "Release $TAG could not be created (likely already exists); uploading/overwriting assets."
            if grep -q "already exists" /tmp/release-create.err; then
              cat /tmp/release-create.err >&2
            fi
            gh release upload "$TAG" "${args[@]}" --clobber
          fi
