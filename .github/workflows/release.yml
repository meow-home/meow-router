name: Release

# Triggered when you push a tag like v1.2.3 to main. The tag version is used to
# build installers for Windows, macOS and Linux and attach them to a GitHub
# Release. NOTE: builds are currently unsigned (no code-signing secrets); only
# the app bundle is produced, not a notarized/signed artifact.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the "tag is on main" ancestor check works.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Only release from tags that land on main, so we don't publish from
      # feature branches that happen to carry a v* tag. With fetch-depth: 0 the
      # full history is present, so we can check ancestry against origin/main.
      - name: Assert tag is on main
        shell: bash
        run: |
          git fetch --depth=1 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point into origin/main; aborting release."
            exit 1
          fi

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bsdtar (libarchive-tools) is used by electron-builder for AppImage;
          # ruby/fpm produce the .deb package.
          sudo apt-get install -y libarchive-tools ruby
          sudo gem install --no-document fpm

      # Derive the app version from the tag, stripping the leading "v".
      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: pnpm --filter @meow-gateway/desktop package --config.extraMetadata.version=$VERSION --publish never

      - name: Collect installers
        shell: bash
        run: echo "Release artifacts are in apps/desktop/dist"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            apps/desktop/dist/**/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**
